<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>法国微信点餐 / Menu</title>
  <!-- 外部套件 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入自訂 CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans select-none overflow-hidden">

  <!-- 顶部店铺招牌 -->
  <header class="bg-gradient-to-r from-red-600 to-orange-500 text-white p-4 shadow-md flex-shrink-0">
    <div class="flex justify-between items-start">
      <div>
        <h1 class="text-xl font-bold tracking-wide" Cici Cusine </h1>>
        <p class="text-xs opacity-90 mt-1">🕒 Livraison 配送 </p>
      </div>
      <button onclick="toggleMode()" class="bg-white/20 hover:bg-white/30 text-white text-xs px-2.5 py-1 rounded-full border border-white/40 transition">
        切换后台
      </button>
    </div>
  </header>

  <!-- 1. 顾客点餐视图 -->
  <div id="customer-view" class="flex-1 flex overflow-hidden relative">
    <div id="category-bar" class="w-24 bg-gray-200 overflow-y-auto no-scrollbar flex-shrink-0 border-r border-gray-300"></div>
    <div id="menu-container" class="flex-1 overflow-y-auto p-3 space-y-4 pb-24">
      <div class="text-center text-gray-400 py-10">菜单加载中...</div>
    </div>

    <!-- 底部悬浮购物车 -->
    <div class="absolute bottom-4 left-3 right-3 bg-gray-900/95 backdrop-blur-md text-white rounded-full p-2.5 shadow-2xl flex justify-between items-center z-30">
      <div class="flex items-center gap-3 pl-2" onclick="toggleCartModal()">
        <div class="relative bg-green-500 p-2.5 rounded-full shadow-lg">
          🛒
          <span id="cart-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
        </div>
        <div>
          <div class="text-lg font-bold text-white"><span id="total-price">0.00</span> €</div>
          <div class="text-[10px] text-gray-400">免预约 / 送餐详情请咨询群主</div>
        </div>
      </div>
      <button onclick="openCheckoutModal()" class="bg-green-500 hover:bg-green-600 active:scale-95 text-white px-6 py-2.5 rounded-full font-bold text-sm transition">
        去结算
      </button>
    </div>
  </div>

  <!-- 2. 下单弹窗 -->
  <div id="checkout-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-lg text-gray-800">确认订单 / Finaliser</h3>
        <button onclick="closeCheckoutModal()" class="text-gray-400 text-xl font-bold">✕</button>
      </div>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">您的姓名 / 微信群昵称 *</label>
          <input id="cust-name" type="text" placeholder="例如：张三 (小巴黎)" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">联系电话 / Téléphone *</label>
          <input id="cust-phone" type="tel" placeholder="例如：06 12 34 56 78" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">备注/送餐地址 (选填)</label>
          <input id="cust-note" type="text" placeholder="例: 少辣 / 18点送到门卫" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm">
        </div>
      </div>

      <div class="bg-gray-50 p-3 rounded-lg flex justify-between items-center text-sm font-bold border">
        <span>应付总计：</span>
        <span class="text-xl text-green-600"><span id="modal-total-price">0.00</span> €</span>
      </div>

      <button onclick="submitOrder()" class="w-full bg-green-500 text-white font-bold py-3 rounded-xl shadow-lg">
        确认提交订单
      </button>
    </div>
  </div>

  <!-- 3. 群主后台视图 -->
  <div id="admin-view" class="hidden flex-1 overflow-y-auto p-4 bg-gray-100">
    <div class="flex justify-between items-center mb-4 border-b pb-2">
      <h2 class="text-lg font-bold text-red-600">🚨 群主实时接单后台</h2>
      <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full">● 实时监听中</span>
    </div>
    <div id="order-list" class="space-y-4">等待新订单...</div>
  </div>

  <!-- 引入自訂 JS 邏輯 -->
  <script src="app.js"></script>
</body>
</html>
