<!-- 8. 菜品詳情大圖預覽彈窗 Modal -->
<div id="dish-detail-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl relative animate-scale-up">
    <!-- 關閉按鈕 -->
    <button type="button" onclick="closeDishDetailModal()" class="absolute top-3 right-3 bg-black/50 hover:bg-black/70 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm z-10 transition">
      ✕
    </button>
    
    <!-- 菜品大圖 -->
    <div id="detail-modal-img-container" class="w-full h-56 bg-gray-100 flex items-center justify-center overflow-hidden">
      <!-- 動態載入圖片或預設圖 -->
    </div>

    <!-- 菜品資訊 -->
    <div class="p-5 space-y-3">
      <div>
        <h3 id="detail-modal-name-fr" class="font-extrabold text-lg text-gray-800 leading-tight"></h3>
        <p id="detail-modal-name-zh" class="text-sm text-gray-500 mt-0.5"></p>
      </div>

      <div class="flex justify-between items-center pt-2 border-t">
        <span id="detail-modal-price" class="text-xl font-black text-green-600">0.00 €</span>
        <span id="detail-modal-stock" class="text-xs text-orange-600 bg-orange-50 px-2 py-1 rounded-full border border-orange-100 font-bold">Stock: 99</span>
      </div>

      <!-- 快捷加入購物車按鈕 -->
      <button id="detail-modal-add-btn" type="button" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl text-sm shadow transition active:scale-95">
        Ajouter au panier / 加入購物車 🛒
      </button>
    </div>
  </div>
</div>
